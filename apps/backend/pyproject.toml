[project]
name = "nexuserp-backend"
version = "0.1.0"
description = "NexusERP backend baseline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121.0,<1.0.0",
  "starlette>=0.49.1,<1.0.0",
  "uvicorn[standard]>=0.32.0,<0.33.0",
  "motor>=3.6.0,<3.7.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "pymongo>=4.9.0,<5.0.0",
  "bcrypt>=4.2.0,<5.0.0",
  "PyJWT[crypto]>=2.10.1,<3.0.0",
  "email-validator>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<0.25.0",
  "httpx>=0.28.0,<0.29.0",
  "ruff>=0.8.0,<0.9.0",
  "mypy>=1.13.0,<1.14.0",
  "bandit>=1.8.0,<1.9.0",
  "detect-secrets>=1.5.0,<1.6.0",
  "pip-audit>=2.7.3,<3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/test_auth.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = "build"

[tool.bandit]
exclude_dirs = ["tests", "build"]
severity = "medium"

[tool.setuptools.packages.find]
include = ["core*", "routers*", "auth*", "catalog*", "purchases*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
